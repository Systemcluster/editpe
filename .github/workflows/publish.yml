name: Publish

on:
  workflow_run:
    branches:
      - main
    workflows:
      - Tests & Checks
    types:
      completed
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  statuses: write

jobs:

  publish:

    name: Publish
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
        toolchain:
          - stable

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false

      - name: Set up Rust toolchain
        uses: Systemcluster/actions@setup-rust-v0
        with:
          channel: ${{ matrix.toolchain }}
          cache-key-job: true

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Publish
        uses: Systemcluster/actions@release-crates-v0
        if: github.ref == 'refs/heads/main' && github.repository_owner == 'Systemcluster'
        with:
          crates-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          dry-run: ${{ !secrets.CARGO_REGISTRY_TOKEN }}
          tag-crate: editpe

  build:

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false

      - name: Install cross-compilation linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}

      - name: Set up Rust toolchain
        uses: Systemcluster/actions@setup-rust-v0
        with:
          channel: stable
          cache-key-job: true

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Configure linker
        if: matrix.linker
        run: |
          TARGET=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          LINKER_BIN=$(echo "${{ matrix.linker }}" | sed 's/^gcc-//')
          echo "CARGO_TARGET_${TARGET}_LINKER=${LINKER_BIN}-gcc" >> $GITHUB_ENV

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} --bin editpe
          cp "target/${{ matrix.target }}/release/editpe${{ matrix.ext }}" "editpe-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: editpe-${{ matrix.target }}${{ matrix.ext }}
          archive: false
